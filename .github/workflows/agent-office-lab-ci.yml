name: Agent Office Lab

on:
  pull_request:
    paths:
      - 'labs/agent-office-lab/**'
      - '.github/workflows/agent-office-lab-ci.yml'
  push:
    branches: [main]
    paths:
      - 'labs/agent-office-lab/**'
      - '.github/workflows/agent-office-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.14.0'
      - name: Check public source, syntax and links (no model inference)
        run: python3 labs/agent-office-lab/scripts/check_publication.py
      - name: Check local provider boundary
        run: node --test labs/agent-office-lab/scripts/*.test.mjs
      - name: Check isolated permission configuration
        run: python3 -m unittest discover -s labs/agent-office-lab/scripts -p 'test_*.py' -v
