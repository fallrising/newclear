name: Agent Platform CI

on:
  pull_request:
    paths: ["platform/agent-platform/**", ".github/workflows/agent-platform-ci.yml"]
  push:
    branches: [main]
    paths: ["platform/agent-platform/**", ".github/workflows/agent-platform-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/agent-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install probe and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and fault-path tests
        run: make check
      - name: Pull immutable Agent Server image
        run: |
          docker pull ghcr.io/openhands/agent-server@sha256:8d015443e480ce5fa0f6f0b21b8031d5b2115840805e28eac89f5d82799ea51b
      - name: Real Agent Server contract (Docker only; no KVM acceptance claim)
        run: make docker-smoke OUTPUT=.artifacts/ci-smoke
      - name: Build pinned VM guest rootfs
        run: docker build -t newclear-agent-m0:ci guest
      - name: Guest rootfs contract (Docker only; no MicroVM boot claim)
        run: agent-platform-m0 guest-image-smoke --image newclear-agent-m0:ci --output .artifacts/guest-ci

  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/agent-platform
    services:
      postgres:
        image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: agent_platform
          POSTGRES_DB: agent_platform_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_platform -d agent_platform_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://agent_platform:ephemeral-ci-only@127.0.0.1:5432/agent_platform_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked platform and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: PostgreSQL control plane, runtime boundaries and HTTP event acceptance
        run: make platform-check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: platform/agent-platform/web/package-lock.json
      - name: Install and build browser acceptance target
        run: |
          npm --prefix web ci
          npm --prefix web run build
          web/node_modules/.bin/playwright install --with-deps chromium
      - name: AT-03 browser reconnect and AT-10 disabled controls
        env:
          PYTHON: python
        run: make browser-test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/agent-platform/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: platform/agent-platform/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
