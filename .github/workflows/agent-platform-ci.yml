name: Agent Platform M0 CI

on:
  pull_request:
    paths: ["platform/agent-platform/**", ".github/workflows/agent-platform-ci.yml"]
  push:
    branches: [main]
    paths: ["platform/agent-platform/**", ".github/workflows/agent-platform-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/agent-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install probe and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and fault-path tests
        run: make check
      - name: Pull immutable Agent Server image
        run: |
          docker pull ghcr.io/openhands/agent-server@sha256:8d015443e480ce5fa0f6f0b21b8031d5b2115840805e28eac89f5d82799ea51b
      - name: Real Agent Server contract (Docker only; KVM gates remain open)
        run: make docker-smoke OUTPUT=.artifacts/ci-smoke
