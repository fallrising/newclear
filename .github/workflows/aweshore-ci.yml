name: AweShore CI

on:
  pull_request:
    paths:
      - labs/aweshore/**
      - .github/workflows/aweshore-ci.yml
  push:
    branches: [main]
    paths:
      - labs/aweshore/**
      - .github/workflows/aweshore-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aweshore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/aweshore/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: labs/aweshore/ui/package-lock.json
      - run: npm ci
      - run: npm run fmt.check
      - run: npm run lint
      - run: npm run build.types
      - run: npm run build
