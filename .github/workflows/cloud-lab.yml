name: Cloud Lab local implementation
on:
  pull_request:
    paths: ['platform/cloud-lab/**', '.github/workflows/cloud-lab.yml']
  push:
    branches: [main]
    paths: ['platform/cloud-lab/**', '.github/workflows/cloud-lab.yml']
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.14.0"
      - name: Verify installed test tools
        run: |
          node --version
          python3 --version
          node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; new DatabaseSync(':memory:').close()"
      - name: Local domain, SQLite boundary and Python HTTP integration
        env:
          AGENT_BUILD_DIR: ${{ runner.temp }}/cloud-lab-build
          AGENT_EVIDENCE_DIR: ${{ runner.temp }}/cloud-lab-evidence
        run: |
          mkdir -p "$AGENT_BUILD_DIR" "$AGENT_EVIDENCE_DIR"
          python3 platform/cloud-lab/tools/check.py
