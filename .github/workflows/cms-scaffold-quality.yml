name: CMS Frontend Quality

on:
  pull_request:
    paths: ["apps/cms-scaffold/**", ".github/workflows/cms-scaffold-quality.yml"]
  push:
    branches: [main]
    paths: ["apps/cms-scaffold/**", ".github/workflows/cms-scaffold-quality.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cms-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/cms-scaffold/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install and verify canonical Traditional Chinese fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cat > "$HOME/.config/fontconfig/conf.d/99-cms-tc.conf" <<'FONTS'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias><family>Noto Sans TC</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
            <alias><family>Noto Serif TC</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
          </fontconfig>
          FONTS
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans TC' | grep -F 'Noto Sans CJK TC'
          fc-match -f '%{family}\n' 'Noto Serif TC' | grep -F 'Noto Serif CJK TC'
      - name: Tooling contracts
        run: node --test scripts/measure-bundles.test.mjs scripts/record-frontend.test.mjs e2e-quality/manifest.contract.test.ts e2e-vitals/routes.contract.test.ts
      - name: Quality harness lint and types
        run: |
          npx eslint e2e-quality e2e-vitals playwright.quality.config.ts playwright.vitals.config.ts
          npx tsc --noEmit --allowImportingTsExtensions --target es2022 --module esnext --moduleResolution bundler --esModuleInterop --skipLibCheck --types node e2e-quality/*.ts e2e-vitals/*.ts playwright.quality.config.ts playwright.vitals.config.ts
      - name: Accessibility
        run: npm run test:a11y
      - name: Behavioral hardening
        run: npm run test:hardening
      - name: Author initial baseline or compare the accepted baseline
        env:
          CMS_EVENT: ${{ github.event_name }}
          CMS_HEAD: ${{ github.head_ref }}
          CMS_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          snapshot_dir=e2e-quality/visual-w5.spec.ts-snapshots
          count=$(find "$snapshot_dir" -maxdepth 1 -type f -name '*.png' 2>/dev/null | wc -l || true)
          if [ "$count" -eq 0 ]; then
            test "$CMS_EVENT" = pull_request
            test "$CMS_HEAD" = feat/cms-w5-hardening
            if git cat-file -e "$CMS_BASE:apps/cms-scaffold/$snapshot_dir" 2>/dev/null; then
              echo 'Refusing to recreate or replace a previously accepted baseline.' >&2
              exit 1
            fi
            CMS_UPDATE_VISUAL_BASELINES=1 npm run test:visual -- --update-snapshots
          else
            test "$count" -eq 70
            npm run test:visual
          fi
          test "$(find "$snapshot_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 70
      - name: Upload canonical screenshots and quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cms-w5-quality-${{ github.sha }}
          path: |
            apps/cms-scaffold/e2e-quality/visual-w5.spec.ts-snapshots/*.png
            apps/cms-scaffold/test-results/frontend/axe.json
            apps/cms-scaffold/test-results/frontend/visual*.json
            apps/cms-scaffold/test-results/frontend/visual-hashes.sha256
            apps/cms-scaffold/test-results/frontend/quality-artifacts/
          if-no-files-found: error
          retention-days: 14
