name: Agent Usage CI

on:
  pull_request:
    paths:
      - tools/codex-usage/**
      - tools/cc-quota/**
      - .github/workflows/codex-usage-ci.yml
  push:
    branches: [main]
    paths:
      - tools/codex-usage/**
      - tools/cc-quota/**
      - .github/workflows/codex-usage-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-usage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/codex-usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Unified and Codex offline tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-usage-pycache
          TMPDIR: ${{ runner.temp }}
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Archived Claude compatibility regression tests
        working-directory: tools/cc-quota
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-usage-pycache
          TMPDIR: ${{ runner.temp }}
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile entry points
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-usage-pycache
        run: python3 -m py_compile codex_usage.py agent_usage.py
