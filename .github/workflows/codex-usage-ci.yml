name: codex-usage CI

on:
  pull_request:
    paths:
      - tools/codex-usage/**
      - .github/workflows/codex-usage-ci.yml
  push:
    branches: [main]
    paths:
      - tools/codex-usage/**
      - .github/workflows/codex-usage-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-usage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/codex-usage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile collector
        run: python3 -m py_compile codex_usage.py
