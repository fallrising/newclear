name: Edge Ops CI

on:
  pull_request:
    paths:
      - platform/edge-ops/**
      - .github/workflows/edge-ops-ci.yml
  push:
    branches: [main]
    paths:
      - platform/edge-ops/**
      - .github/workflows/edge-ops-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-ops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/edge-ops/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: platform/edge-ops/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  agent:
    name: Agent contracts (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/edge-ops/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.7"
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
