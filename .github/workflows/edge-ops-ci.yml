name: Edge Ops CI
on:
  pull_request:
    paths: ['platform/edge-ops/**', '.github/workflows/edge-ops-ci.yml']
  push:
    branches: [main]
    paths: ['platform/edge-ops/**', '.github/workflows/edge-ops-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-ops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: platform/edge-ops
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
      - name: Shared contracts and SQLite HTTP fault tests
        run: npm run check
      - name: Install frozen Worker toolchain
        run: npm --prefix backend ci
      - name: Typecheck Worker and common contract
        run: npm --prefix backend run typecheck
      - name: Real local workerd and D1 HTTP chain (no remote resources)
        run: npm --prefix backend run test:workerd
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: platform/edge-ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
      - name: Install frozen UI toolchain and build
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Install browser
        run: web/node_modules/.bin/playwright install --with-deps chromium
      - name: React + actual HTTP + mock Agent browser acceptance
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: edge-ops-browser-evidence
          retention-days: 7
          path: |
            platform/edge-ops/web/playwright-report/
            platform/edge-ops/web/test-results/
            platform/edge-ops/web/dist/
