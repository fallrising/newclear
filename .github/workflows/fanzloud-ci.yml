name: Fanzloud CI

on:
  pull_request:
    paths:
      - platform/fanzloud/**
      - .github/workflows/fanzloud-ci.yml
  push:
    branches: [main]
    paths:
      - platform/fanzloud/**
      - .github/workflows/fanzloud-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanzloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and operator web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: platform/fanzloud
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Test private operator web
        run: node --test --test-isolation=none apps/control-plane/web/p0-client.test.mjs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install dependency policy checker
        run: cargo install cargo-deny --version 0.19.4 --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Build application binaries
        run: cargo build --locked --workspace --bins --all-features
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check whitespace
        run: git diff --check
