name: Fleet CI

on:
  pull_request:
    paths:
      - specs/fleet/**
      - .github/workflows/fleet-ci.yml
  push:
    branches: [main]
    paths:
      - specs/fleet/**
      - .github/workflows/fleet-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: specs/fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: specs/fleet/go.mod
          cache-dependency-path: specs/fleet/go.sum
      - run: make test vet validate-schema build
