name: Goku CI

on:
  pull_request:
    paths:
      - products/goku/**
      - .github/workflows/goku-ci.yml
  push:
    branches: [main]
    paths:
      - products/goku/**
      - .github/workflows/goku-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goku-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [products/goku/api, products/goku/cli, products/goku/consumer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.3"
          cache-dependency-path: ${{ matrix.directory }}/go.sum
      - name: Test Go module
        working-directory: ${{ matrix.directory }}
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/goku/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: products/goku/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
