name: Ice Maker CI

on:
  pull_request:
    paths: ["platform/ice-maker/**", ".github/workflows/ice-maker-ci.yml"]
  push:
    branches: [main]
    paths: ["platform/ice-maker/**", ".github/workflows/ice-maker-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ice-maker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/ice-maker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run repository gate
        run: make check
