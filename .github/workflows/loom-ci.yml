name: Loom CI

on:
  pull_request:
    paths:
      - apps/loom/**
      - .github/workflows/loom-ci.yml
  push:
    branches: [main]
    paths:
      - apps/loom/**
      - .github/workflows/loom-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: apps/loom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/loom/package-lock.json
      - name: Native Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.88 --profile minimal --component rustfmt --component clippy
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --no-fail-fast
      - name: Generated contract drift
        run: |
          git diff --exit-code -- src/contracts/
          if [ -n "$(git status --porcelain --untracked-files=all -- src/contracts/)" ]; then
            git status --short --untracked-files=all -- src/contracts/
            echo "::error::Generated contracts changed, including new untracked files."
            exit 1
          fi
      - run: cargo clippy --locked -p loom-contracts --all-targets -- -D warnings
      - run: npm run typecheck:contracts
      - run: npm run typecheck:app
      - run: npm test
      - run: npm run build
      - run: git diff --check
