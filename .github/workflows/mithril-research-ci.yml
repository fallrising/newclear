name: Mithril research local contracts

on:
  pull_request:
    paths:
      - 'labs/mithril-research/**'
      - '.github/workflows/mithril-research-ci.yml'
  push:
    branches: [main]
    paths:
      - 'labs/mithril-research/**'
      - '.github/workflows/mithril-research-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mithril-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Offline local-fixture contracts
        env:
          TMPDIR: ${{ runner.temp }}
        run: make -C labs/mithril-research check
      - name: Synthetic lifecycle through the CLI
        env:
          TMPDIR: ${{ runner.temp }}
        run: make -C labs/mithril-research demo DEMO_OUTPUT="${RUNNER_TEMP}/mithril-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
