name: OpenViking context lab CI
on:
  pull_request:
    paths:
      - labs/openviking-context/**
      - .github/workflows/openviking-context-ci.yml
  push:
    branches: [main]
    paths:
      - labs/openviking-context/**
      - .github/workflows/openviking-context-ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openviking-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline contracts and demo
        run: make -C labs/openviking-context check
