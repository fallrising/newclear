name: Phark CI

on:
  pull_request:
    paths:
      - products/phark/**
      - .github/workflows/phark-ci.yml
  push:
    branches: [main]
    paths:
      - products/phark/**
      - .github/workflows/phark-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/phark/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn test --batch-mode

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/phark/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: products/phark/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
