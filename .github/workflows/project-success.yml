name: Project success contracts

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-success-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install opencc-python-reimplemented==0.1.7
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check_indexes.py
      - name: Catalog PR description matches generated status
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}" "${{ github.base_ref }}:refs/remotes/pr-base/${{ github.base_ref }}"
          python3 tools/gameplay-pattern-catalog/status.py --check-pr-body --base "refs/remotes/pr-base/${{ github.base_ref }}"
