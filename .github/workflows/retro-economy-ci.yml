name: Retro Economy CI

on:
  pull_request:
    paths:
      - labs/retro-economy/**
      - .github/workflows/retro-economy-ci.yml
  push:
    branches: [main]
    paths:
      - labs/retro-economy/**
      - .github/workflows/retro-economy-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retro-economy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solo-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGENT_BUILD_DIR: ${{ runner.temp }}/retro-build
      AGENT_EVIDENCE_DIR: ${{ runner.temp }}/retro-evidence
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/retro-pycache
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Domain, SQLite and HTTP tests
        run: python3 -m unittest discover -s labs/retro-economy/tests -p 'test_*.py' -v
      - name: Durable browser client tests
        run: node --test --test-isolation=none labs/retro-economy/tests/test_ui.mjs
      - name: Real Chromium route and restart acceptance
        run: node labs/retro-economy/tests/browser_smoke.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retro-economy-browser
          path: ${{ runner.temp }}/retro-evidence
          if-no-files-found: error
