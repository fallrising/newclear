name: Signal Hub CI

on:
  pull_request:
    paths:
      - platform/signal-hub/**
      - .github/workflows/signal-hub-ci.yml
  push:
    branches: [main]
    paths:
      - platform/signal-hub/**
      - .github/workflows/signal-hub-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/signal-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.8"
          cache: true
          cache-dependency-path: platform/signal-hub/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o /tmp/signalhub ./cmd/signalhub
      - name: Contract fixtures and OpenAPI
        run: |
          python3 -m venv /tmp/signalhub-contracts
          /tmp/signalhub-contracts/bin/pip install --only-binary=:all: -r contracts/requirements.txt
          /tmp/signalhub-contracts/bin/python contracts/check.py
          /tmp/signalhub-contracts/bin/python scripts/e2e_smoke.py --binary /tmp/signalhub
