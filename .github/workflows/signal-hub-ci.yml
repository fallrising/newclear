name: Signal Hub CI

on:
  pull_request:
    paths:
      - platform/signal-hub/**
      - .github/workflows/signal-hub-ci.yml
  push:
    branches: [main]
    paths:
      - platform/signal-hub/**
      - .github/workflows/signal-hub-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/signal-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.8"
          cache: true
          cache-dependency-path: platform/signal-hub/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            platform/signal-hub/web/package-lock.json
            platform/signal-hub/browser/package-lock.json
      - name: Board types, unit tests and reproducible assets
        working-directory: platform/signal-hub/web
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
          git diff --exit-code -- dist
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o /tmp/signalhub ./cmd/signalhub
      - name: Contract fixtures and OpenAPI
        run: |
          python3 -m venv /tmp/signalhub-contracts
          /tmp/signalhub-contracts/bin/pip install --only-binary=:all: -r contracts/requirements.txt
          /tmp/signalhub-contracts/bin/python contracts/check.py
          /tmp/signalhub-contracts/bin/python scripts/e2e_smoke.py --binary /tmp/signalhub
      - name: Real Go binary browser acceptance
        working-directory: platform/signal-hub/browser
        env:
          SIGNALHUB_BINARY: /tmp/signalhub
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
