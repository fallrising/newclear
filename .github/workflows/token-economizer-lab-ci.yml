name: TokenEconomizer lab CI

on:
  pull_request:
    paths:
      - labs/token-economizer-lab/**
      - .github/workflows/token-economizer-lab-ci.yml
  push:
    branches: [main]
    paths:
      - labs/token-economizer-lab/**
      - .github/workflows/token-economizer-lab-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-economizer-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-mechanisms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Fetch pinned official source (no package installation)
        run: make -C labs/token-economizer-lab prepare
      - name: Real mechanisms and isolation regressions
        run: make -C labs/token-economizer-lab check
      - name: Capture synthetic-input real-runtime report
        run: python3 -B labs/token-economizer-lab/run.py --out labs/token-economizer-lab/work/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-economizer-offline-report
          path: labs/token-economizer-lab/work/report.json
          if-no-files-found: error
          retention-days: 7
