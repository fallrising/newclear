name: Wotar required gates

on:
  pull_request:
    paths: ["systems/wotar/**", ".github/workflows/wotar-ci.yml"]
  push:
    branches: [main]
    paths: ["systems/wotar/**", ".github/workflows/wotar-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: systems/wotar/secure-mqtt-e2ee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install existing development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run gates with isolated test credentials
        run: python scripts/verify_isolated.py --output "${{ runner.temp }}/wotar-${{ github.run_id }}-${{ github.run_attempt }}"
