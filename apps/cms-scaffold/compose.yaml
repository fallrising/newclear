services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - cms-postgres:/var/lib/postgresql/data

  cms-api:
    build:
      context: .
      dockerfile: services/cms-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cms
      SPRING_DATASOURCE_USERNAME: cms
      SPRING_DATASOURCE_PASSWORD: cms
      SERVER_PORT: "8080"
      CMS_MEDIA_ROOT: /data/media
    volumes:
      - cms-media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  web-front:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: web-front
        PORT: "5173"
        VITE_API_BASE: http://localhost:8080
    ports:
      - "5173:5173"

  web-back:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: web-back
        PORT: "5174"
        VITE_API_BASE: http://localhost:8080
    ports:
      - "5174:5174"

  web-admin:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: web-admin
        PORT: "5175"
        VITE_API_BASE: http://localhost:8080
    ports:
      - "5175:5175"

volumes:
  cms-postgres:
  cms-media:
