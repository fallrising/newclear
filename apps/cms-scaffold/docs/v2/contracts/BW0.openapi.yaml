    post:
      operationId: adminCreateContentType
      tags: [Admin]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as adminListContentTypes.
        - 422 FIELD_VALIDATION: key does not match `^[a-z][a-z0-9_]{1,62}$` or already exists.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContentTypeRequest" }
      responses:
        "201":
          description: Type created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentType" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "422": { $ref: "#/components/responses/Error422" }
