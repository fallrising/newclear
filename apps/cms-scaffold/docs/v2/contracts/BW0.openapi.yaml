openapi: 3.0.3
info:
  title: CMS Scaffold API
  description: |
    Kernel API for CMS Scaffold. Handwritten OpenAPI is the contract source.

    Public reads live under `/api/v1/public/**`. Work surfaces do not share
    that prefix. Session cookie name is `cms_session` (one cookie).
    Published media is not a public static directory.

    Surface is resolved from the `Origin` header (see `cms.identity.surface-origins`).
    A cookie request without `Origin` is treated as the Front surface. A bearer request
    without `Origin` may name its surface with `X-CMS-Surface`.

    Every error response uses `ErrorEnvelope`; `error.code` is one of `ErrorCode`.
    Each operation lists its error codes in its description.

    Common errors (not repeated per operation):
    - 401 `UNAUTHENTICATED` (no session) or `SESSION_EXPIRED` (expired or revoked session)
      on every operation that is not marked `security: []`.
    - 403 `CSRF_FAILED` on every POST, PUT, PATCH, DELETE sent with a `cms_session` cookie
      when the `X-CSRF-Token` header does not equal the `cms_csrf` cookie.
    - 400 `VALIDATION_FAILED` when a path or query parameter has the wrong type
      (for example a malformed UUID) or a JSON body cannot be parsed.
    - 405 `METHOD_NOT_ALLOWED` when the path exists but the HTTP method does not.
    - 415 `MEDIA_TYPE_NOT_SUPPORTED` when a JSON operation receives another Content-Type.
    - 500 `INTERNAL_ERROR` for any unexpected server failure.
  version: 0.4.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local compose (API port 8080)
tags:
  - name: Health
  - name: Auth
  - name: Principals
  - name: Content
  - name: Media
  - name: Admin
paths:
  /actuator/health:
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema: { $ref: "#/components/schemas/Health" }
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Process is down (Spring Boot Actuator body)
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema: { $ref: "#/components/schemas/Health" }
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      operationId: getOpenApi
      tags: [Health]
      security: []
      responses:
        "200":
          description: Handwritten OpenAPI document
          content:
            text/yaml:
              schema: { type: string }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      description: |
        Errors:
        - 400 VALIDATION_FAILED: username or password missing or blank.
        - 401 INVALID_CREDENTIALS: unknown username or wrong password.
        - 403 ACCOUNT_DISABLED: principal is disabled.
        - 403 ACCOUNT_LOCKED: principal is locked after repeated failures.
        - 403 CSRF_FAILED: `Origin` is present and not in `cms.identity.cors-origins`,
          or the request already carries a session cookie without a matching CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated; sets cms_session and cms_csrf cookies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Current session revoked; cookies cleared }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/auth/me:
    get:
      operationId: me
      tags: [Auth]
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error401" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/auth/csrf:
    get:
      operationId: csrf
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Issues a new cms_csrf cookie and returns the same token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [Auth]
      description: |
        Errors:
        - 400 VALIDATION_FAILED: new password shorter than 12 characters or equal to the username.
        - 401 INVALID_CREDENTIALS: current password is wrong.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: Password changed; all sessions revoked; cookies cleared }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals:
    get:
      operationId: listPrincipals
      tags: [Principals]
      description: |
        Requires `manage_principals` on the Admin surface.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front or Back surface.
        - 403 FORBIDDEN: caller lacks `manage_principals`.
      responses:
        "200":
          description: Principal list without credential hashes (not paginated; page is always 0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrincipalList" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
    post:
      operationId: createPrincipal
      tags: [Principals]
      description: |
        Requires `manage_principals` on the Admin surface. When `temporaryPassword` is omitted
        the server generates one and returns it once.
        Errors:
        - 400 VALIDATION_FAILED: username does not match `^[a-z0-9._-]{3,32}$`, username is taken,
          or the temporary password is shorter than 12 characters or equals the username.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrincipalRequest" }
      responses:
        "201":
          description: Principal created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPrincipal" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals/{id}:
    get:
      operationId: getPrincipal
      tags: [Principals]
      description: |
        Errors:
        - 400 VALIDATION_FAILED: no principal with this id (message `not found`; see BQ-06).
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
    patch:
      operationId: patchPrincipal
      tags: [Principals]
      description: |
        Null or absent properties keep their current value.
        Errors:
        - 400 VALIDATION_FAILED: no principal with this id, or `status` is not a PrincipalStatus.
        - 403 LAST_ADMIN: the change would leave no active admin.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchPrincipalRequest" }
      responses:
        "200":
          description: Updated principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals/{id}/disable:
    post:
      operationId: disablePrincipal
      tags: [Principals]
      description: |
        Revokes every session of the principal.
        Errors:
        - 400 VALIDATION_FAILED: no principal with this id.
        - 403 LAST_ADMIN: the principal is the last active admin.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Disabled principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals/{id}/unlock:
    post:
      operationId: unlockPrincipal
      tags: [Principals]
      description: |
        Errors:
        - 400 VALIDATION_FAILED: no principal with this id.
        - 403 ACCOUNT_DISABLED: a disabled principal cannot be unlocked.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Unlocked principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals/{id}/roles:
    put:
      operationId: replacePrincipalRoles
      tags: [Principals]
      description: |
        Replaces all role assignments. `editor` and `operator` need a non-empty `contentTypeCodes`.
        Errors:
        - 400 VALIDATION_FAILED: no principal with this id, missing or duplicate role code,
          unknown role, or editor/operator without an allowlist.
        - 403 LAST_ADMIN: the change would leave no active admin.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RoleAssignmentInput" }
      responses:
        "204": { description: Roles replaced }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals/{id}/password:
    post:
      operationId: setPrincipalPassword
      tags: [Principals]
      description: |
        Sets a temporary password and revokes every session of the principal. When the body or
        `temporaryPassword` is omitted the server generates one. The password is returned once.
        Errors:
        - 400 VALIDATION_FAILED: no principal with this id, or the password is shorter than
          12 characters or equals the username.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemporaryPasswordRequest" }
      responses:
        "200":
          description: Temporary password set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPassword" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/principals/{id}/effective-permissions:
    get:
      operationId: effectivePermissions
      tags: [Principals]
      description: |
        Lists anonymous grants plus the grants of every role of the principal. An unknown id
        returns only the anonymous grants.
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Effective grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectivePermissionList" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [Principals]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/roles/{code}/permissions:
    get:
      operationId: getRolePermissions
      tags: [Principals]
      description: |
        Errors:
        - 400 VALIDATION_FAILED: unknown role code.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/RoleCode"
      responses:
        "200":
          description: Role permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionList" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
    put:
      operationId: replaceRolePermissions
      tags: [Principals]
      description: |
        Replaces all permissions of the role. Omitted `allowedSurfaces` default to
        `[front, back, admin]` for `read_published`, `[admin]` for governance actions
        (`manage_types`, `manage_principals`, `manage_settings`, `read_audit`) and
        `[back, admin]` otherwise.
        Errors:
        - 400 VALIDATION_FAILED: unknown role, unknown action, unknown surface, duplicate
          permission, malformed predicate, or an empty list for the anonymous role.
        - 403 LAST_ADMIN: the change would leave no active admin.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listPrincipals.
      parameters:
        - $ref: "#/components/parameters/RoleCode"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/PermissionInput" }
      responses:
        "204": { description: Permissions replaced }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/content-types:
    get:
      operationId: listPublicContentTypes
      tags: [Content]
      security: []
      responses:
        "200":
          description: Enabled types the caller may read_published on the Front surface
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicContentTypeList" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/content-types/{typeKey}/entries:
    get:
      operationId: listPublicEntries
      tags: [Content]
      security: []
      description: |
        Published entries only. Entries whose `visibility` payload value is `unlisted` or
        `private` are omitted. Not paginated in this version (`offset` is 0 and `limit`
        equals the item count).
        Relation filter: a query parameter named `ref.<fieldKey>` with an entry UUID value keeps
        entries whose `<fieldKey>` references that entry. When several are given, one of them
        is applied.
        Errors:
        - 400 AUDIENCE_PARAM_REJECTED: `state`, `includeDraft` or `asOf` is present.
        - 400 VALIDATION_FAILED: a `ref.<fieldKey>` value is not a UUID.
        - 403 FORBIDDEN: caller may not read_published this type.
        - 404 ENTRY_NOT_FOUND: type does not exist or is disabled.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Published entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEntryPage" }
        "400": { $ref: "#/components/responses/Error400" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/content-types/{typeKey}/entries/{id}:
    get:
      operationId: getPublicEntry
      tags: [Content]
      security: []
      description: |
        Errors:
        - 400 AUDIENCE_PARAM_REJECTED: `state`, `includeDraft` or `asOf` is present.
        - 403 FORBIDDEN: caller may not read_published this type or this entry.
        - 404 ENTRY_NOT_FOUND: type missing or disabled; entry missing, deleted, not published,
          `private`, of another type, or referencing an unpublished required relation.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Published entry; no draft fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/content-types/{typeKey}/slugs/{slug}:
    get:
      operationId: getPublicEntryBySlug
      tags: [Content]
      security: []
      description: |
        Same rules as getPublicEntry. `unlisted` entries are readable by slug.
        Errors:
        - 400 AUDIENCE_PARAM_REJECTED, 403 FORBIDDEN, 404 ENTRY_NOT_FOUND: as getPublicEntry.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published entry by slug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/navigation/{menuKey}:
    get:
      operationId: getPublicNavigation
      tags: [Content]
      security: []
      description: |
        Errors:
        - 404 NAVIGATION_NOT_FOUND: menu missing or never published.
      parameters:
        - $ref: "#/components/parameters/MenuKey"
      responses:
        "200":
          description: Published navigation document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NavigationDocument" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/content-types:
    get:
      operationId: listWorkContentTypes
      tags: [Content]
      description: |
        Enabled types. Fields with visibility `internal` and disabled fields are omitted.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
      responses:
        "200":
          description: Enabled types for Back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkContentTypeList" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/content-types/{typeKey}:
    get:
      operationId: getWorkContentType
      tags: [Content]
      description: |
        Returns the type even when it is disabled.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
        - 404 CONTENT_TYPE_NOT_FOUND: type does not exist.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
      responses:
        "200":
          description: Type schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkContentType" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/content-types/{typeKey}/entries:
    get:
      operationId: listWorkEntries
      tags: [Content]
      description: |
        Work copies, newest `updatedAt` first. Not paginated in this version (`offset` is 0 and
        `limit` equals the item count). Without `state` all three states are returned.
        Relation filter: `ref.<fieldKey>=<uuid>` as in listPublicEntries.
        Errors:
        - 400 VALIDATION_FAILED: a `ref.<fieldKey>` value is not a UUID.
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
        - 403 FORBIDDEN: caller lacks `read_draft` (or `read_published` when `state=published`)
          on this type, or holds only a predicate-scoped grant (B-10).
        - 404 CONTENT_TYPE_NOT_FOUND: type does not exist.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/State"
      responses:
        "200":
          description: Work entries including drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntryPage" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
    post:
      operationId: createEntry
      tags: [Content]
      description: |
        Creates a draft. `version` in the body is ignored.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
        - 403 FORBIDDEN: caller lacks `create` on this type.
        - 404 CONTENT_TYPE_NOT_FOUND: type does not exist.
        - 409 TYPE_DISABLED: type is disabled.
        - 409 SINGLETON_EXISTS: singleton type already has an entry.
        - 409 SLUG_CONFLICT: slug already used in this type.
        - 422 FIELD_VALIDATION: reserved key, wrong value type, or unknown enum value.
        - 422 REF_TARGET_NOT_FOUND, REF_TARGET_WRONG_TYPE, PRINCIPAL_REF_UNRESOLVED: bad reference.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryWriteRequest" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "415": { $ref: "#/components/responses/Error415" }
        "422": { $ref: "#/components/responses/Error422" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}:
    get:
      operationId: getWorkEntry
      tags: [Content]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
        - 403 FORBIDDEN: caller may not read this entry.
        - 404 ENTRY_NOT_FOUND: entry missing or soft-deleted.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Work copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
    patch:
      operationId: patchEntry
      tags: [Content]
      description: |
        Merges `payload` keys into the work copy; a key with value null is stored as null.
        When `version` is present it must equal the current version.
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `update`).
        - 404 ENTRY_NOT_FOUND: entry missing.
        - 409 INVALID_STATE_TRANSITION: entry is archived or soft-deleted.
        - 409 VERSION_CONFLICT: `version` does not match.
        - 409 SLUG_CONFLICT: slug already used in this type.
        - 422 FIELD_VALIDATION, REF_TARGET_NOT_FOUND, REF_TARGET_WRONG_TYPE,
          PRINCIPAL_REF_UNRESOLVED: as createEntry.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryWriteRequest" }
      responses:
        "200":
          description: Work copy updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "415": { $ref: "#/components/responses/Error415" }
        "422": { $ref: "#/components/responses/Error422" }
        "500": { $ref: "#/components/responses/Error500" }
    delete:
      operationId: softDeleteEntry
      tags: [Content]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `delete`).
        - 404 ENTRY_NOT_FOUND: entry missing or already soft-deleted.
        - 409 REF_CONSTRAINT: another entry still references this entry.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Soft deleted }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}/publish:
    post:
      operationId: publishEntry
      tags: [Content]
      description: |
        Publishing a published entry without changes returns it unchanged.
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `publish`).
        - 404 ENTRY_NOT_FOUND: entry missing or soft-deleted.
        - 409 INVALID_STATE_TRANSITION: entry is archived.
        - 409 TYPE_DISABLED: type is disabled.
        - 422 SLUG_REQUIRED: slug policy `required` and slug empty.
        - 422 FIELD_VALIDATION: a required field is empty or a value is invalid.
        - 422 REF_TARGET_NOT_FOUND, REF_TARGET_WRONG_TYPE, PRINCIPAL_REF_UNRESOLVED: bad reference.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "422": { $ref: "#/components/responses/Error422" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}/unpublish:
    post:
      operationId: unpublishEntry
      tags: [Content]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `unpublish`).
        - 404 ENTRY_NOT_FOUND: entry missing or soft-deleted.
        - 409 INVALID_STATE_TRANSITION: entry is not published.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Returned to draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}/archive:
    post:
      operationId: archiveEntry
      tags: [Content]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `archive`).
        - 404 ENTRY_NOT_FOUND: entry missing or soft-deleted.
        - 409 INVALID_STATE_TRANSITION: entry is already archived.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}/restore:
    post:
      operationId: restoreEntry
      tags: [Content]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `archive`).
        - 404 ENTRY_NOT_FOUND: entry missing or soft-deleted.
        - 409 INVALID_STATE_TRANSITION: entry is not archived.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Restored to draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}/revisions:
    get:
      operationId: listRevisions
      tags: [Content]
      description: |
        Publish snapshots, newest first; at most 20 are kept.
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `read_draft`).
        - 404 ENTRY_NOT_FOUND: entry missing.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Publish snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionList" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/entries/{id}/revisions/{revisionNo}/revert:
    post:
      operationId: revertRevision
      tags: [Content]
      description: |
        Copies the revision payload into the work copy; the published copy is unchanged.
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as getWorkEntry (action `update`).
        - 404 ENTRY_NOT_FOUND: entry or revision missing.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RevisionNo"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Work copy reverted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/preview/entries/{id}:
    get:
      operationId: previewEntry
      tags: [Content]
      description: |
        Same body and errors as getWorkEntry. Not a Front origin.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Work copy for Back preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEntry" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/admin/content-types:
    get:
      operationId: adminListContentTypes
      tags: [Admin]
      description: |
        Requires `manage_types` (Admin surface).
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front or Back surface.
        - 403 FORBIDDEN: caller lacks `manage_types`.
      responses:
        "200":
          description: All types including disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentTypeList" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
