        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentType" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/admin/content-types/{typeKey}/enable:
    post:
      operationId: enableContentType
      tags: [Admin]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as adminListContentTypes.
        - 404 CONTENT_TYPE_NOT_FOUND: type does not exist.
      parameters:
        - $ref: "#/components/parameters/TypeKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentType" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/admin/navigation/{menuKey}:
    get:
      operationId: adminGetNavigation
      tags: [Admin]
      description: |
        Requires `manage_settings` (Admin surface).
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front or Back surface.
        - 403 FORBIDDEN: caller lacks `manage_settings`.
        - 404 NAVIGATION_NOT_FOUND: menu does not exist.
      parameters:
        - $ref: "#/components/parameters/MenuKey"
      responses:
        "200":
          description: Work navigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Navigation" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
    patch:
      operationId: adminPatchNavigation
      tags: [Admin]
      description: |
        Replaces the work document; `document: null` keeps the current document.
        Errors: as adminGetNavigation.
      parameters:
        - $ref: "#/components/parameters/MenuKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NavigationPatchRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Navigation" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/admin/navigation/{menuKey}/publish:
    post:
      operationId: adminPublishNavigation
      tags: [Admin]
      description: |
        Errors: as adminGetNavigation.
      parameters:
        - $ref: "#/components/parameters/MenuKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Navigation" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/admin/entries/{id}/purge:
    post:
      operationId: purgeEntry
      tags: [Admin]
      description: |
        Hard delete with an audit event. Admin role on the Admin surface only.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front or Back surface.
        - 403 FORBIDDEN: caller does not hold the admin role.
        - 404 ENTRY_NOT_FOUND: entry missing.
        - 409 REF_CONSTRAINT: another entry still references this entry.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Hard deleted with audit }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/admin/audit:
    get:
      operationId: listAudit
      tags: [Admin]
      description: |
        Newest first. Not paginated in this version.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front or Back surface.
        - 403 FORBIDDEN: caller lacks `read_audit`.
      parameters:
        - in: query
          name: action
          required: false
          description: Exact audit action, for example `LOGIN_SUCCESS`.
          schema: { type: string }
        - in: query
          name: targetId
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/media:
    get:
      operationId: listMedia
      tags: [Media]
      description: |
        Available (not deleted) media, newest first. Requires `manage_media`.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
        - 403 FORBIDDEN: caller lacks `manage_media`.
      responses:
        "200":
          description: Available media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAssetList" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
    post:
      operationId: uploadMedia
      tags: [Media]
      description: |
        Accepts JPEG, PNG, GIF and PDF (detected from bytes, not from the filename).
        Images get `thumbnail` (max 320px) and `web` (max 1600px) JPEG variants.
        Errors:
        - 400 VALIDATION_FAILED: the `file` part is missing.
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listMedia.
        - 409 quota_exceeded: library or per-principal quota would be exceeded.
        - 413 file_too_large: file is larger than the configured maximum.
        - 415 unsupported_media_type: empty file or not an allowed type.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/MediaUploadRequest" }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "409": { $ref: "#/components/responses/Error409" }
        "413": { $ref: "#/components/responses/Error413" }
        "415": { $ref: "#/components/responses/Error415" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/media/quota:
    get:
      operationId: mediaQuota
      tags: [Media]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listMedia.
      responses:
        "200":
          description: Quota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaQuota" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/media/{id}:
    get:
      operationId: getMedia
      tags: [Media]
      description: |
        Returns deleted media metadata as well.
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listMedia.
        - 404 not_found: media does not exist.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Media metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
    delete:
      operationId: softDeleteMedia
      tags: [Media]
      description: |
        Errors:
        - 403 SURFACE_FORBIDDEN, FORBIDDEN: as listMedia.
        - 404 not_found: media does not exist.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Soft deleted }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/media/{id}/file/{variant}:
    get:
      operationId: privateMediaFile
      tags: [Media]
      description: |
        Readable with `manage_media`, or with `read_draft` on an entry the media is attached to.
        Errors:
        - 403 SURFACE_FORBIDDEN: called from the Front surface.
        - 403 FORBIDDEN: caller may not read this media.
        - 404 not_found: media does not exist.
        - 404 variant_not_available: variant is not original, thumbnail or web, or was not generated.
        - 410 gone: media is soft-deleted.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Variant"
      responses:
        "200":
          description: Private bytes (Cache-Control private, no-store)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "410": { $ref: "#/components/responses/Error410" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/media/{id}:
    get:
      operationId: publicMediaMeta
      tags: [Media]
      security: []
      description: |
        Errors:
        - 404 not_found: media missing, deleted, or not attached to a published public entry field.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Public metadata (variant URLs use the public prefix)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { $ref: "#/components/responses/Error400" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
  /api/v1/public/media/{id}/file/{variant}:
    get:
      operationId: publicMediaFile
      tags: [Media]
      security: []
      description: |
        Errors:
        - 404 not_found: media not publicly readable, or the variant is unknown or missing.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Variant"
      responses:
        "200":
          description: Public bytes (Cache-Control private, no-store)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error400" }
        "404": { $ref: "#/components/responses/Error404" }
        "500": { $ref: "#/components/responses/Error500" }
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    TypeKey:
      in: path
      name: typeKey
      required: true
      schema: { type: string }
    MenuKey:
      in: path
      name: menuKey
      required: true
      schema: { type: string }
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string }
    RoleCode:
      in: path
      name: code
      required: true
      schema: { type: string }
    RevisionNo:
      in: path
      name: revisionNo
      required: true
      schema: { type: integer, format: int32 }
    Variant:
      in: path
      name: variant
      required: true
      schema:
        type: string
        enum: [original, thumbnail, web]
    Q:
      in: query
      name: q
      required: false
      description: Case-insensitive substring of the payload `title` value.
      schema: { type: string }
    State:
      in: query
      name: state
      required: false
      description: Comma-separated publication states, for example `draft,published`.
      schema: { type: string }
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: false
      description: Required when the request carries the cms_session cookie; must equal the cms_csrf cookie.
      schema: { type: string }
  responses:
    Error400:
      description: Bad request. See the operation description for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error401:
      description: UNAUTHENTICATED, SESSION_EXPIRED or INVALID_CREDENTIALS.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error403:
      description: Forbidden. See the operation description for codes; CSRF_FAILED applies to every unsafe cookie request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error404:
      description: Not found. See the operation description for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error409:
      description: Conflict. See the operation description for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error410:
      description: Gone. See the operation description for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error413:
      description: Payload too large (file_too_large).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error415:
      description: Unsupported media type. See the operation description for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error422:
      description: Unprocessable content. See the operation description for codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error500:
      description: INTERNAL_ERROR.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cms_session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorCode:
      type: string
      description: |
        Every `error.code` the API can return. Media codes are lowercase for compatibility (BQ-07).
      enum:
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - SESSION_EXPIRED
        - ACCOUNT_DISABLED
        - ACCOUNT_LOCKED
        - CSRF_FAILED
        - FORBIDDEN
        - SURFACE_FORBIDDEN
        - VALIDATION_FAILED
        - LAST_ADMIN
        - ENTRY_NOT_FOUND
        - CONTENT_TYPE_NOT_FOUND
        - NAVIGATION_NOT_FOUND
        - AUDIENCE_PARAM_REJECTED
        - INVALID_STATE_TRANSITION
        - SLUG_CONFLICT
        - VERSION_CONFLICT
        - TYPE_DISABLED
        - TYPE_IN_USE
        - REF_CONSTRAINT
        - SINGLETON_EXISTS
        - SLUG_REQUIRED
        - FIELD_VALIDATION
        - REF_TARGET_NOT_FOUND
        - REF_TARGET_WRONG_TYPE
        - PRINCIPAL_REF_UNRESOLVED
        - not_found
        - variant_not_available
        - unsupported_media_type
        - quota_exceeded
        - file_too_large
        - gone
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - MEDIA_TYPE_NOT_SUPPORTED
        - INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        requestId:
          type: string
          description: Echo of X-Request-Id, or a server-generated UUID.
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: English developer message. Not for display.
            action:
              type: string
              description: Present on FORBIDDEN and SURFACE_FORBIDDEN.
            contentType:
              type: string
              description: Present when the denied action targets a content type.
            surface:
              type: string
              description: Present on FORBIDDEN and SURFACE_FORBIDDEN.
    Health:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          example: UP
        groups:
          type: array
          items: { type: string }
    Surface:
      type: string
      enum: [front, back, admin]
    CmsAction:
      type: string
      enum:
        - read_published
        - read_draft
        - create
        - update
        - publish
        - unpublish
        - delete
        - archive
        - manage_media
        - manage_types
        - manage_principals
        - manage_settings
        - read_audit
    PrincipalStatus:
      type: string
      enum: [active, disabled, locked]
    PublicationState:
      type: string
      enum: [draft, published, archived]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        surface:
          type: string
          description: Ignored; the surface comes from Origin.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken: { type: string }
    MePrincipal:
      type: object
      additionalProperties: false
      required: [id, username, displayName, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        status: { $ref: "#/components/schemas/PrincipalStatus" }
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [code, contentTypeCodes]
      properties:
        code: { type: string }
        contentTypeCodes:
          type: array
          items: { type: string }
    SurfaceFlags:
      type: object
      additionalProperties: false
      required: [front, back, admin]
      properties:
        front: { type: boolean }
        back: { type: boolean }
        admin: { type: boolean }
    Me:
      type: object
      additionalProperties: false
      required: [principal, roles, surfaces]
      properties:
        principal: { $ref: "#/components/schemas/MePrincipal" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        surfaces: { $ref: "#/components/schemas/SurfaceFlags" }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [principal, roles, surfaces, csrfToken]
      properties:
        principal: { $ref: "#/components/schemas/MePrincipal" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        surfaces: { $ref: "#/components/schemas/SurfaceFlags" }
        csrfToken: { type: string }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12 }
    Principal:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PrincipalStatus" }
    PrincipalList:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Principal" }
        page: { type: integer, description: Always 0 in this version. }
        size: { type: integer }
        total: { type: integer }
    CreatePrincipalRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, pattern: "^[a-z0-9._-]{3,32}$" }
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        temporaryPassword: { type: string, nullable: true, minLength: 12 }
    CreatedPrincipal:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, status, temporaryPassword]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PrincipalStatus" }
        temporaryPassword:
          type: string
          description: Returned once. Never logged.
    PatchPrincipalRequest:
      type: object
      properties:
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status:
          allOf:
            - $ref: "#/components/schemas/PrincipalStatus"
          nullable: true
    RoleAssignmentInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }
        contentTypeCodes:
          type: array
          nullable: true
          items: { type: string }
    TemporaryPasswordRequest:
      type: object
      properties:
        temporaryPassword: { type: string, nullable: true, minLength: 12 }
    TemporaryPassword:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string }
    EffectivePermission:
      type: object
      additionalProperties: false
      required: [role, action, contentType, allowedSurfaces, allowlist]
      properties:
        role: { type: string }
        action: { $ref: "#/components/schemas/CmsAction" }
        contentType:
          type: string
          description: Empty string for a grant without a content type.
        allowedSurfaces:
          type: array
          items: { $ref: "#/components/schemas/Surface" }
        allowlist:
          type: array
          items: { type: string }
    EffectivePermissionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EffectivePermission" }
    Role:
      type: object
      additionalProperties: false
      required: [code, displayName, system]
      properties:
        code: { type: string }
        displayName: { type: string }
        system: { type: boolean }
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    Permission:
      type: object
      additionalProperties: false
      required: [id, action, contentTypeCode, predicateJson, allowedSurfaces]
      properties:
        id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/CmsAction" }
        contentTypeCode: { type: string, nullable: true }
        predicateJson:
          type: string
          nullable: true
          description: 'JSON text, for example {"type":"fieldEquals","field":"ownerPrincipalId","value":"$currentPrincipalId"}.'
        allowedSurfaces:
          type: array
          items: { $ref: "#/components/schemas/Surface" }
    PermissionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    PermissionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/CmsAction" }
        contentTypeCode: { type: string, nullable: true }
        predicateJson: { type: string, nullable: true }
        allowedSurfaces:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Surface" }
    EntryPayload:
      type: object
      additionalProperties: true
      description: Field values keyed by field key. Shape depends on the content type.
    PublicField:
      type: object
      additionalProperties: false
      required: [key, type, required]
      properties:
        key: { type: string }
        type: { type: string }
        required: { type: boolean }
    PublicContentType:
      type: object
      additionalProperties: false
      required: [key, displayName, pluralDisplayName, titleField, fields]
      properties:
        key: { type: string }
        displayName: { type: string }
        pluralDisplayName: { type: string }
        titleField: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PublicField" }
    PublicContentTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicContentType" }
    PublicEntry:
      type: object
      additionalProperties: false
      required: [id, contentType, slug, title, payload, publishedAt]
      description: |
        Published copy. Only public fields are present. A readable `media-ref` value is
        replaced by a MediaAsset object; any other `media-ref` value is returned as stored (B-13).
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string }
        slug: { type: string, nullable: true }
        title:
          type: string
          nullable: true
          description: Value of the type's titleField in the published payload.
        payload: { $ref: "#/components/schemas/EntryPayload" }
        publishedAt: { type: string, format: date-time }
    PublicEntryPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicEntry" }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    NavigationDocument:
      type: object
      additionalProperties: true
      description: "Navigation document. The seeded menus use an items array of objects with label and href."
    WorkField:
      type: object
      additionalProperties: false
      required: [key, type, required, refTarget, enumValues]
      properties:
        key: { type: string }
        type: { type: string }
        required: { type: boolean }
        refTarget: { type: string, nullable: true }
        enumValues:
          type: array
          items: { type: string }
    WorkContentType:
      type: object
      additionalProperties: false
      required: [key, displayName, pluralDisplayName, titleField, slugPolicy, fields]
      properties:
        key: { type: string }
        displayName: { type: string }
        pluralDisplayName: { type: string }
        titleField: { type: string }
        slugPolicy:
          type: string
          enum: [required, optional, none]
        fields:
          type: array
          items: { $ref: "#/components/schemas/WorkField" }
    WorkContentTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkContentType" }
    WorkEntry:
      type: object
      additionalProperties: false
      required: [id, contentType, slug, publicationState, version, title, payload, dirty, publishedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string }
        slug: { type: string, nullable: true }
        publicationState: { $ref: "#/components/schemas/PublicationState" }
        version: { type: integer, format: int32 }
        title:
          type: string
          nullable: true
          description: Value of payload.title (not titleField; see B-03, fixed in BW1).
        payload: { $ref: "#/components/schemas/EntryPayload" }
        dirty:
          type: boolean
          description: True when published and the work copy differs from the published copy.
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    WorkEntryPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkEntry" }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    EntryWriteRequest:
      type: object
      properties:
        slug: { type: string, nullable: true }
        payload:
          allOf:
            - $ref: "#/components/schemas/EntryPayload"
          nullable: true
        version:
          type: integer
          format: int32
          nullable: true
          description: Optimistic lock for PATCH; ignored on create.
    Revision:
      type: object
      additionalProperties: false
      required: [revisionNo, slug, publishedAt]
      properties:
        revisionNo: { type: integer, format: int32 }
        slug:
          type: string
          description: Empty string when the revision had no slug.
        publishedAt: { type: string, format: date-time }
    RevisionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Revision" }
    AdminField:
      type: object
      additionalProperties: false
      required: [key, type, required, indexed, refTarget]
      properties:
        key: { type: string }
        type: { type: string }
        required: { type: boolean }
        indexed: { type: boolean }
        refTarget: { type: string, nullable: true }
    AdminContentType:
      type: object
      additionalProperties: false
      required: [key, displayName, pluralDisplayName, titleField, slugPolicy, enabled, fields]
      properties:
        key: { type: string }
        displayName: { type: string }
        pluralDisplayName: { type: string }
        titleField: { type: string }
        slugPolicy:
          type: string
          enum: [required, optional, none]
        enabled: { type: boolean }
        fields:
          type: array
          items: { $ref: "#/components/schemas/AdminField" }
    AdminContentTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminContentType" }
    CreateFieldRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
        type:
          type: string
          nullable: true
          description: Defaults to `string`.
        required: { type: boolean, nullable: true }
        indexed: { type: boolean, nullable: true }
        refTarget: { type: string, nullable: true }
        enumValues:
          type: array
          nullable: true
          items: { type: string }
    CreateContentTypeRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
        displayName: { type: string, nullable: true }
        pluralDisplayName: { type: string, nullable: true }
        titleField:
          type: string
          nullable: true
          description: Defaults to `title`.
        slugPolicy:
          type: string
          nullable: true
          enum: [required, optional, none, null]
          description: Defaults to `optional`.
        fields:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/CreateFieldRequest" }
    Navigation:
      type: object
      additionalProperties: false
      required: [key, publicationState, version, document]
      properties:
        key: { type: string }
        publicationState:
          type: string
          enum: [draft, published]
        version: { type: integer, format: int32 }
        document: { $ref: "#/components/schemas/NavigationDocument" }
    NavigationPatchRequest:
      type: object
      properties:
        document:
          allOf:
            - $ref: "#/components/schemas/NavigationDocument"
          nullable: true
    AuditEventSummary:
      type: object
      additionalProperties: false
      required: [action, targetType, targetId, outcome, at]
      properties:
        action: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: string, format: uuid, nullable: true }
        outcome: { type: string }
        at: { type: string, format: date-time }
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEventSummary" }
    MediaVariantLink:
      type: object
      additionalProperties: false
      required: [url, width, height, contentType, byteSize]
      properties:
        url: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
    MediaVariants:
      type: object
      additionalProperties: false
      properties:
        original: { $ref: "#/components/schemas/MediaVariantLink" }
        thumbnail: { $ref: "#/components/schemas/MediaVariantLink" }
        web: { $ref: "#/components/schemas/MediaVariantLink" }
    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, mediaId, title, altText, contentType, byteSize, width, height, variants]
      properties:
        id: { type: string, format: uuid }
        mediaId:
          type: string
          format: uuid
          description: Same value as id.
        title: { type: string }
        altText: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        variants: { $ref: "#/components/schemas/MediaVariants" }
    MediaAssetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
    MediaQuota:
      type: object
      additionalProperties: false
      required: [usedFiles, usedBytes, maxFiles, maxLibraryBytes, maxFileBytes]
      properties:
        usedFiles: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        maxFiles: { type: integer, format: int32 }
        maxLibraryBytes: { type: integer, format: int64 }
        maxFileBytes: { type: integer, format: int64 }
    MediaUploadRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        title: { type: string }
        altText: { type: string }
security:
  - cookieAuth: []
  - bearerAuth: []
