[package]
name = "flowshot-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.24.0", features = ["v7"] }
sha2 = "=0.11.0"
serde_json = "=1.0.151"
unicode-normalization = "=0.1.26"
caseless = "=0.2.2"

[[bench]]
name = "seed"
harness = false
