[workspace]
resolver = "2"
members = ["contracts", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

# B1: PTY, async, persistence, observability
portable-pty       = "0.9"
tokio              = { version = "1", features = ["full"] }
rusqlite           = { version = "0.32", features = ["bundled"] }
uuid               = { version = "1", features = ["v7", "fast-rng"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot        = "0.12"
thiserror          = "1"
async-trait        = "0.1"

# B2: filesystem watcher + content hashing for the echo-loop guard
notify             = "8"
blake3             = "1"

# B4: AI bridge — HTTP + SSE for Anthropic API
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util       = "0.3"
tokio-util         = "0.7"

# V (vertical slice): Tauri shell connecting B1/B2 to a real window.
tauri              = { version = "2", features = [] }
tauri-build        = { version = "2", features = [] }

# B1 dev
tokio-test         = "0.4"
tempfile           = "3"
pretty_assertions  = "1"


[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A0 carries a lot of public types with cheap field names; relax noisy lints.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Domain doc comments reference identifiers that aren't crate types (TDD section
# numbers, SQLite, MCP, etc.) — they're already wrapped in backticks where it
# helps readability.
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
