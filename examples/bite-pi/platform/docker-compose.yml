# Generated by platform-bootstrap (Pi skill demo)
# Project: platform
name: platform

networks:
  edge:
    name: platform_edge

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  skywalking_es: {}
  nine_router_data: {}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [edge]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [edge]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "changeme"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks: [edge]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [edge]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    depends_on: [loki]
    restart: unless-stopped

  # LLM gateway — official 9router (OpenAI-compatible /v1)
  # Dashboard: http://127.0.0.1:20128/dashboard
  # Clients (Pi / OpenCode / etc.): http://127.0.0.1:20128/v1
  # Configure upstream providers in the dashboard — do not commit API keys.
  nine_router:
    image: decolua/9router:latest
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - nine_router_data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
    networks: [edge]
    restart: unless-stopped

  # Optional APM — enable with ENABLE_APM=1
  # UI intentionally bound to localhost-style private use; put behind nginx+auth in real life.
  elasticsearch:
    profiles: ["apm"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - skywalking_es:/usr/share/elasticsearch/data
    networks: [edge]
    restart: unless-stopped

  skywalking-oap:
    profiles: ["apm"]
    image: apache/skywalking-oap-server:10.1.0
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
    ports:
      - "11800:11800"
      - "12800:12800"
    networks: [edge]
    depends_on: [elasticsearch]
    restart: unless-stopped

  skywalking-ui:
    profiles: ["apm"]
    image: apache/skywalking-ui:10.1.0
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8080:8080"
    networks: [edge]
    depends_on: [skywalking-oap]
    restart: unless-stopped
