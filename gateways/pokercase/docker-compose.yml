services:
  thinrouter:
    build: .
    image: thinrouter:local
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      THINROUTER_HOST: "0.0.0.0"
      THINROUTER_PORT: "20128"
      THINROUTER_DATA_DIR: "/data"
      THINROUTER_ADMIN_TOKEN: "${THINROUTER_ADMIN_TOKEN:?Set THINROUTER_ADMIN_TOKEN before starting thinrouter}"
      # THINROUTER_SECRETS_KEY: "optional-passphrase"
    volumes:
      - thinrouter-data:/data
    restart: unless-stopped

volumes:
  thinrouter-data:
