# Original research fixture settings; not production configuration.
# Trusted disposable host only. No authentication: never expose externally.
# Prerequisite: own healthy Redis Cluster on these loopback seed ports.
bind 127.0.0.1
port 7979
announce-addr 127.0.0.1:7979
bootstrap 127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
worker-threads 2
backend-conns 1
backend-sharding no
reply-cache no
slave-mode off
placement least-loaded
maxclients 128
query-buffer-limit 16mb
tcp-keepalive 300
topology-refresh-secs 15
loglevel notice
