# Local development database. API and worker run separately through the CLI.
name: agent-platform-m1
services:
  postgres:
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18.6 Alpine
    environment:
      POSTGRES_USER: agent_platform
      POSTGRES_DB: agent_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform -d agent_platform"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
volumes:
  postgres-data:
