name = "cloud-lab"
main = "worker/index.mjs"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cloud-lab"
database_id = "REPLACE_IN_PRIVATE_DEPLOYMENT_CONFIG"
migrations_dir = "migrations"

# No route, domain or Cron trigger enabled by this public template.
# Set PUBLIC_ORIGIN, AUDIENCE privately. MACHINE_KEYS and ACCESS_CONFIG are secrets.
# A target deployment must pass Access/ingress/live recovery qualification first.
