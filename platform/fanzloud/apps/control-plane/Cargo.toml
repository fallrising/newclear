[package]
name = "codebox-control-plane"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
codebox-agent-codex = { version = "=0.0.0", path = "../../crates/codebox-agent-codex" }
codebox-domain = { version = "=0.0.0", path = "../../crates/codebox-domain" }
codebox-session-runtime = { version = "=0.0.0", path = "../../crates/codebox-session-runtime" }
getrandom = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.18"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
http-body = "1"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.29", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
