[package]
name = "codebox-agent-codex"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["alloc", "no_std"] }
