[package]
name = "codebox-event-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
codebox-domain = { version = "=0.0.0", path = "../codebox-domain" }
libc = "0.2"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["alloc", "no_std"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "sync", "test-util"] }
