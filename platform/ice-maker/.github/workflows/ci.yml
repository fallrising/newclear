name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The repository gate validates stale-base rejection against HEAD~1.
          fetch-depth: 0
      - name: Run repository-native gate
        run: make check
