name: local-ocr-services

x-ocr-common: &ocr-common
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  environment: &ocr-environment
    OCR_API_KEY: ${OCR_API_KEY:-}
    OCR_MAX_UPLOAD_BYTES: ${OCR_MAX_UPLOAD_BYTES:-10485760}
    OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-25000000}
    OCR_MAX_IMAGE_DIMENSION: ${OCR_MAX_IMAGE_DIMENSION:-16384}
    OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-1}
    OCR_MAX_QUEUE_SIZE: ${OCR_MAX_QUEUE_SIZE:-1}
    OCR_QUEUE_TIMEOUT_SECONDS: ${OCR_QUEUE_TIMEOUT_SECONDS:-5}
    OCR_ENGINE_THREADS: ${OCR_ENGINE_THREADS:-2}
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 90s

services:
  rapidocr:
    <<: *ocr-common
    profiles: [rapidocr, all]
    build:
      context: .
      dockerfile: docker/Dockerfile.rapidocr
    image: local-ocr-services/rapidocr:0.1.0
    ports:
      - "${OCR_BIND_IP:-127.0.0.1}:${RAPIDOCR_PORT:-8011}:8000"
    cpus: ${RAPIDOCR_CPUS:-2.0}
    mem_limit: ${RAPIDOCR_MEMORY:-4g}

  tesseract:
    <<: *ocr-common
    profiles: [tesseract, all]
    build:
      context: .
      dockerfile: docker/Dockerfile.tesseract
    image: local-ocr-services/tesseract:0.1.0
    environment:
      <<: *ocr-environment
      OCR_TESSERACT_LANGUAGES: ${OCR_TESSERACT_LANGUAGES:-chi_tra+eng}
    ports:
      - "${OCR_BIND_IP:-127.0.0.1}:${TESSERACT_PORT:-8012}:8000"
    cpus: ${TESSERACT_CPUS:-2.0}
    mem_limit: ${TESSERACT_MEMORY:-2g}

  paddle-structure:
    <<: *ocr-common
    profiles: [paddle-structure, all]
    build:
      context: .
      dockerfile: docker/Dockerfile.paddle-structure
    image: local-ocr-services/paddle-structure:0.1.0
    ports:
      - "${OCR_BIND_IP:-127.0.0.1}:${PADDLE_STRUCTURE_PORT:-8013}:8000"
    cpus: ${PADDLE_STRUCTURE_CPUS:-4.0}
    mem_limit: ${PADDLE_STRUCTURE_MEMORY:-16g}
