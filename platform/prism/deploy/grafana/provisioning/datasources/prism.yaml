apiVersion: 1

datasources:
  - name: Prism-Metrics
    uid: prism-metrics
    type: prometheus
    access: proxy
    url: http://prismd:9090/prom
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 2.53.0        # 必須與 buildinfo 一致，見 ADR-005
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: prism-traces
    editable: false
    secureJsonData:
      httpHeaderValue1: 'Bearer $PRISM_DATASOURCE_TOKEN'

  - name: Prism-Logs
    uid: prism-logs
    type: loki
    access: proxy
    url: http://prismd:9090
    jsonData:
      maxLines: 1000
      timeout: 60
      derivedFields:
        # 從日誌中抽出 trace_id 並連到 Jaeger datasource
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: prism-traces
        # 相容：body 中內嵌 trace_id 的情形
        - name: TraceIDInline
          matcherType: regex
          matcherRegex: 'trace[_-]?id["\s:=]+([a-f0-9]{32})'
          url: '$${__value.raw}'
          datasourceUid: prism-traces
    editable: false

  - name: Prism-Traces
    uid: prism-traces
    type: jaeger
    access: proxy
    url: http://prismd:9090/jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: prism-logs
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      tracesToMetrics:
        datasourceUid: prism-metrics
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        queries:
          - name: 'Request rate'
            query: 'sum(rate(traces_span_metrics_calls_total{$$__tags}[5m]))'
      nodeGraph:
        enabled: true
    editable: false

  - name: Prism-Alerts
    uid: prism-alerts
    type: alertmanager
    access: proxy
    url: http://prismd:9090/alertmanager
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    editable: false
