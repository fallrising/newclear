name = "spring-pool-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-30"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[vars]
BUILD_REVISION = "dev"

[[d1_databases]]
binding = "DB"
database_name = "spring-pool-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.staging]
name = "spring-pool-api-staging"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-30"
workers_dev = false
preview_urls = false

[env.staging.build]
command = "worker-build --release"

[env.staging.vars]
BUILD_REVISION = "dev"

# Operator replaces this dedicated D1 placeholder from external configuration.
# Do not commit a real Cloudflare database id.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "spring-pool-api-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
