        - if: { properties: { operation: { const: SubmitHumanReport } } }
          then: { properties: { expected_version: { type: integer, minimum: 1, maximum: 9223372036854775806 }, payload: { $ref: "#/components/schemas/SubmitHumanReportPayload" } } }
        - if: { properties: { operation: { const: AcceptInitialSpecification } } }
