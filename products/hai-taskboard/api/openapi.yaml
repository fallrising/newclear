                contentEncoding: base64
                maxLength: 87384
                pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/][AQgw]==|[A-Za-z0-9+/]{2}[AEIMQUYcgkosw048]=)?$"
    InitialSpecificationAcceptedResult:
      type: object
      additionalProperties: false
      required: [type, project_id, version, proposal_digest, graph_revision_digest, accepted_revision_digest, acceptance_subject_digest]
      properties:
        type: { const: InitialSpecificationAccepted }
        project_id: { $ref: "#/components/schemas/ProjectID" }
        version: { type: integer, minimum: 2, maximum: 9223372036854775807 }
        proposal_digest: { $ref: "#/components/schemas/SHA256" }
        graph_revision_digest: { $ref: "#/components/schemas/SHA256" }
        accepted_revision_digest: { $ref: "#/components/schemas/SHA256" }
        acceptance_subject_digest: { $ref: "#/components/schemas/SHA256" }
    ProposeSpecificationPayload:
      type: object
      additionalProperties: false
      required: [repository_binding_id, binding_version, binding_digest, ref, manifest_path]
      properties:
        repository_binding_id: { type: string, minLength: 1, maxLength: 120 }
        binding_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        binding_digest: { $ref: "#/components/schemas/SHA256" }
        ref: { type: string, minLength: 1, maxLength: 200 }
        manifest_path: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        Exact approved binding and exact allowlisted ref/manifest path. Ordinary command
        metadata and expected project version remain required. This creates only a durable
        proposal; it does not accept a specification, move a head, mark Ready or dispatch.
        No local path, executable, Reader or approval is accepted from HTTP.
    RepositoryBindingDescription:
      type: object
      additionalProperties: false
      required: [binding, binding_digest]
      properties:
        binding_digest: { $ref: "#/components/schemas/SHA256" }
        binding:
          type: object
          additionalProperties: false
          required: [schema_version, project_id, id, version, object_format, configuration_id,
                     refs, manifest_paths, approved_by_actor]
          properties:
            schema_version: { const: 1 }
            project_id: { $ref: "#/components/schemas/ProjectID" }
            id: { type: string, minLength: 1, maxLength: 120 }
            version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
            object_format: { type: string, enum: [sha1, sha256] }
            configuration_id: { type: string, minLength: 1, maxLength: 120 }
            approved_by_actor: { type: string, minLength: 1, maxLength: 120 }
            refs:
              type: array
              minItems: 1
              maxItems: 256
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 200 }
            manifest_paths:
              type: array
              minItems: 1
              maxItems: 256
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 512 }
    SpecificationProposedResult:
      type: object
      additionalProperties: false
      required: [type, project_id, version, proposal_digest, graph_revision_digest, object_format, commit_oid]
      properties:
        type: { const: SpecificationProposed }
        project_id: { $ref: "#/components/schemas/ProjectID" }
        version: { type: integer, minimum: 1 }
        proposal_digest: { $ref: "#/components/schemas/SHA256" }
        graph_revision_digest: { $ref: "#/components/schemas/SHA256" }
        object_format: { type: string, enum: [sha1, sha256] }
        commit_oid: { type: string }
      allOf:
        - if: { properties: { object_format: { const: sha1 } } }
          then: { properties: { commit_oid: { pattern: "^(?!0+$)[0-9a-f]{40}$" } } }
        - if: { properties: { object_format: { const: sha256 } } }
          then: { properties: { commit_oid: { pattern: "^(?!0+$)[0-9a-f]{64}$" } } }
    CreateWorkItemPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, title, goal, owner_id, required_ac_revisions]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        title: { type: string, minLength: 1, maxLength: 240 }
        goal: { type: string, minLength: 1, maxLength: 8000 }
        owner_id: { type: string, minLength: 1, maxLength: 120 }
        required_ac_revisions:
          type: array
          minItems: 0
          items: { $ref: "#/components/schemas/ACRevisionRef" }
    UpdateWorkItemMetadataPayload:
      type: object
      additionalProperties: false
      required: [work_item_id]
      anyOf:
        - required: [title]
        - required: [goal]
        - required: [owner_id]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        title: { type: string, minLength: 1, maxLength: 240 }
        goal: { type: string, minLength: 1, maxLength: 8000 }
        owner_id: { type: string, minLength: 1, maxLength: 120 }
    SimpleWorkItemPayload:
      type: object
      additionalProperties: false
      required: [work_item_id]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
    DispatchRunPayload:
      type: object
      additionalProperties: false
      description: >-
        Starts a Run from Ready, or from Developing when the WorkItem has Runs and every Run is settled
        (Succeeded or Failed, reconciliation None, side effects Confirmed, not CancelRequested). A Developing
        redispatch is refused with retryable lifecycle_rejected unless the server clock is strictly after every
        existing Run. retry_of_run_id is not supported.
      required: [work_item_id, adapter_id, scenario_id]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        adapter_id: { type: string, const: fake/v1 }
        scenario_id: { type: string, minLength: 1, maxLength: 120 }
        retry_of_run_id: { $ref: "#/components/schemas/RunID" }
    SubmitCandidatePayload:
      type: object
      additionalProperties: false
      required: [work_item_id, run_id, candidate]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        run_id: { $ref: "#/components/schemas/RunID" }
        candidate: { $ref: "#/components/schemas/Candidate" }
    RequestQAPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, candidate_id, completion_subject_digest]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        candidate_id: { type: string, minLength: 1, maxLength: 80 }
        completion_subject_digest: { $ref: "#/components/schemas/SHA256" }
    RequestReworkPayload:
      type: object
      additionalProperties: false
      description: >-
        Review or QA to Developing. The success result (type ReworkRequested, phase Developing) also records reason
        and subject_digest. subject_digest must equal the preparation subject of
        the current Candidate (the Candidate of the WorkItem's latest Run); otherwise 409 stale_subject. reason is
        1..2000 code points and at most 8000 UTF-8 bytes, without NUL or control characters except tab and newline.
        No Review, Evidence, Approval, Candidate, Run or CompletionRecord changes.
      required: [work_item_id, subject_digest, reason]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        subject_digest: { $ref: "#/components/schemas/SHA256" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    CompleteWorkItemPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, completion_subject]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        completion_subject: { $ref: "#/components/schemas/CompletionSubject" }
    ReopenWorkItemPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, target_phase, reason]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        target_phase: { type: string, enum: [Draft, Ready] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    RequestCancellationPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, run_id, reason]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        run_id: { $ref: "#/components/schemas/RunID" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    FinalizeCancellationPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, run_id, verified_stopped, observation_digest]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        run_id: { $ref: "#/components/schemas/RunID" }
        verified_stopped: { const: true }
        observation_digest: { $ref: "#/components/schemas/SHA256" }
    AddBlockerPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, blocker]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        blocker: { $ref: "#/components/schemas/Blocker" }
    ResolveBlockerPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, blocker_id, resolution_ref]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        blocker_id: { type: string, minLength: 1, maxLength: 80 }
        resolution_ref: { type: string, minLength: 1, maxLength: 200 }
    AcceptSpecificationRevisionPayload:
      type: object
      additionalProperties: false
      required: [commit_oid, manifest_digest]
      properties:
        commit_oid: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        manifest_digest: { $ref: "#/components/schemas/SHA256" }
    PreviewImpactPlanPayload:
      type: object
      additionalProperties: false
      required: [commit_oid, manifest_digest, base_graph_revision_digest]
      properties:
        commit_oid: { type: string, pattern: "^[0-9a-f]{40,64}$" }
        manifest_digest: { $ref: "#/components/schemas/SHA256" }
        base_graph_revision_digest: { $ref: "#/components/schemas/SHA256" }
    ActivateImpactPlanPayload:
      type: object
      additionalProperties: false
      required: [impact_plan_id, impact_plan_digest, expected_graph_version, approval_subject_digest]
      properties:
        impact_plan_id: { type: string, pattern: "^iplan_[0-9A-HJKMNP-TV-Z]{10,26}$" }
        impact_plan_digest: { $ref: "#/components/schemas/SHA256" }
        expected_graph_version: { type: integer, minimum: 0 }
        approval_subject_digest: { $ref: "#/components/schemas/SHA256" }
    ReconcileRunPayload:
      type: object
      additionalProperties: false
      required: [run_id, lease_epoch, restore_generation, process_observation, side_effect_outcome]
      properties:
        run_id: { $ref: "#/components/schemas/RunID" }
        lease_epoch: { type: integer, minimum: 1 }
        restore_generation: { type: integer, minimum: 1 }
        process_observation: { type: string, enum: [Unknown, Live, Exited] }
        side_effect_outcome: { type: string, enum: [NotApplicable, Confirmed, OutcomeUnknown] }
        execution_handle_digest: { $ref: "#/components/schemas/SHA256" }
    PublishFixtureObservationPayload:
      type: object
      additionalProperties: false
      required: [run_id, lease_epoch, restore_generation, observed_state, side_effect_outcome]
      properties:
        run_id: { $ref: "#/components/schemas/RunID" }
        lease_epoch: { type: integer, minimum: 1 }
        restore_generation: { type: integer, minimum: 1 }
        observed_state:
          type: string
          enum: [Starting, Running, WaitingHuman, Succeeded, Failed, TimedOut, Canceled, Interrupted]
        side_effect_outcome: { type: string, enum: [NotApplicable, Confirmed, OutcomeUnknown] }
        execution_handle_digest: { $ref: "#/components/schemas/SHA256" }
    PublishFixtureReviewPayload:
      type: object
      additionalProperties: false
      required: [run_id, lease_epoch, restore_generation, review]
      properties:
        run_id: { $ref: "#/components/schemas/RunID" }
        lease_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        restore_generation: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        review: { $ref: "#/components/schemas/Review" }
    PublishFixtureEvidencePayload:
      type: object
      additionalProperties: false
      required: [run_id, lease_epoch, restore_generation, evidence]
      properties:
        run_id: { $ref: "#/components/schemas/RunID" }
        lease_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        restore_generation: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        evidence: { $ref: "#/components/schemas/Evidence" }
    ApproveSubjectPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, candidate_id, approval_request_id, subject_digest, decision]
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        candidate_id: { type: string, minLength: 1, maxLength: 80 }
        approval_request_id: { type: string, minLength: 1, maxLength: 80 }
        subject_digest: { $ref: "#/components/schemas/SHA256" }
        decision: { type: string, enum: [Approved, Rejected] }
    CommandSuccess:
      type: object
      additionalProperties: false
      required: [api_version, ok, command, result, audit, projection_cursor, correlation_id]
      properties:
        api_version: { const: v1 }
        ok: { const: true }
        command:
          type: object
          additionalProperties: false
          required: [command_id, operation, status, replayed]
          properties:
            command_id: { $ref: "#/components/schemas/CommandID" }
            operation: { type: string }
            status: { type: string, const: recorded }
            replayed: { type: boolean }
        result:
          type: object
          additionalProperties: true
          required: [type]
          properties: { type: { type: string } }
        audit:
          type: object
          additionalProperties: false
          required: [sequence]
          properties: { sequence: { type: integer, minimum: 1 } }
        projection_cursor: { $ref: "#/components/schemas/StreamCursor" }
        correlation_id: { type: string, minLength: 1, maxLength: 80 }
      allOf:
        - if:
            properties:
              command:
                properties: { operation: { const: SubmitHumanReport } }
          then:
            properties:
              result: { $ref: "#/components/schemas/HumanReportSubmittedResult" }
          else:
            properties:
              result:
                properties: { report_id: false, report_kind: false }
        - if:
            properties:
              command:
                properties: { operation: { const: RequestRework } }
          then:
            properties:
              result: { $ref: "#/components/schemas/ReworkRequestedResult" }
          else:
            properties:
              result:
                properties: { reason: false, subject_digest: false }
        - if:
            properties:
              command:
                properties: { operation: { const: ProposeSpecification } }
          then:
            properties:
              result: { $ref: "#/components/schemas/SpecificationProposedResult" }
          else:
            if:
              properties:
                command:
                  properties: { operation: { const: AcceptInitialSpecification } }
            then:
              properties:
                result: { $ref: "#/components/schemas/InitialSpecificationAcceptedResult" }
            else:
              properties:
                result:
                  properties:
                    proposal_digest: false
                    graph_revision_digest: false
                    accepted_revision_digest: false
                    acceptance_subject_digest: false
                    object_format: false
                    commit_oid: false
    ReworkRequestedResult:
      type: object
      additionalProperties: false
      required: [type, project_id, work_item_id, version, phase, reason, subject_digest]
      properties:
        type: { const: ReworkRequested }
        project_id: { $ref: "#/components/schemas/ProjectID" }
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        version: { type: integer, minimum: 1 }
        phase: { const: Developing }
        reason: { type: string, minLength: 1, maxLength: 2000, description: Byte-exact rework reason; at most 8000 UTF-8 bytes. }
        subject_digest: { $ref: "#/components/schemas/SHA256" }
    CommandFailure:
      type: object
      additionalProperties: false
      required: [api_version, ok, command_id, error, correlation_id]
      properties:
        api_version: { const: v1 }
        ok: { const: false }
        command_id: { $ref: "#/components/schemas/CommandID" }
        error: { $ref: "#/components/schemas/ErrorBody" }
        correlation_id: { type: string, minLength: 1, maxLength: 80 }
    APIError:
      type: object
      additionalProperties: false
      required: [api_version, ok, error, correlation_id]
      properties:
        api_version: { const: v1 }
        ok: { const: false }
        error: { $ref: "#/components/schemas/ErrorBody" }
        correlation_id: { type: string, minLength: 1, maxLength: 80 }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            [invalid_request, unauthenticated, permission_denied, not_found, version_conflict,
             idempotency_conflict, idempotency_expired, stale_subject, policy_rejected, impact_plan_stale,
             lifecycle_rejected, done_gate_unsatisfied, capability_unsupported, outcome_unknown,
             storage_corruption, projection_unavailable]
        message: { type: string, minLength: 1, maxLength: 1000 }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
          maxProperties: 32
          description: Bounded authorized structured fields; never logs or artifact text.
