      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict: { type: string, enum: [Approved, ChangesRequested] }
    HumanReportEvidenceIntent:
      type: object
      additionalProperties: false
      required: [ac_id, ac_revision_digest, recipe_digest, environment_digest, verdict]
      properties:
        ac_id: { $ref: "#/components/schemas/InitialACID" }
        ac_revision_digest: { $ref: "#/components/schemas/SHA256" }
        recipe_digest: { $ref: "#/components/schemas/SHA256" }
        environment_digest: { $ref: "#/components/schemas/SHA256" }
        verdict: { const: Passing }
    SubmitHumanReportPayload:
      type: object
      additionalProperties: false
      required: [work_item_id, run_id, report_id, completion_subject_digest, lease_epoch, restore_generation, kind, media_type, content]
      description: >-
        Explicit human intent. Content must be 1..65536 UTF-8 bytes, no NUL, exact decoded
        bytes preserved. Reject invalid UTF-8/surrogate JSON, duplicate/unknown/null fields,
        wrong union arms and supplied identities/locators. Digest/length/actor/class/time
        are server-derived. Review requires Review phase; Evidence allows Review or QA and
        exact independent human policy/nonzero environment. No phase/version/Done change.
        Preflight/storage failures are unrecorded; final transactional decisions use existing
        idempotency rules. Bound material capacity and immutable metadata before/after Put.
      properties:
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        run_id: { $ref: "#/components/schemas/RunID" }
        report_id: { $ref: "#/components/schemas/HumanReportID" }
        completion_subject_digest: { $ref: "#/components/schemas/SHA256" }
        lease_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        restore_generation: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        kind: { type: string, enum: [review, evidence] }
        media_type: { type: string, enum: [text/plain, text/markdown] }
        content:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: '^[^\x00]*$'
          description: Limit is UTF-8 bytes, stricter than this schema's character count.
        review: { $ref: "#/components/schemas/HumanReportReviewIntent" }
        evidence: { $ref: "#/components/schemas/HumanReportEvidenceIntent" }
      oneOf:
        - properties: { kind: { const: review }, evidence: false }
          required: [review]
        - properties: { kind: { const: evidence }, review: false }
          required: [evidence]
    HumanReport:
      type: object
      additionalProperties: false
      required: [project_id, work_item_id, run_id, report_id, kind, completion_subject_digest, actor_id, created_at, lease_epoch, restore_generation, artifact]
      properties:
        project_id: { $ref: "#/components/schemas/ProjectID" }
        work_item_id: { $ref: "#/components/schemas/WorkItemID" }
        run_id: { $ref: "#/components/schemas/RunID" }
        report_id: { $ref: "#/components/schemas/HumanReportID" }
        kind: { type: string, enum: [review, evidence] }
        completion_subject_digest: { $ref: "#/components/schemas/SHA256" }
        actor_id: { type: string, minLength: 1, maxLength: 120 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        lease_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        restore_generation: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        artifact:
          type: object
          additionalProperties: false
          required: [sha256, media_type, byte_length, availability, href, disposition]
          properties:
            sha256: { $ref: "#/components/schemas/SHA256" }
            media_type: { type: string, enum: [text/plain, text/markdown] }
            byte_length: { type: integer, minimum: 1, maximum: 65536 }
            availability: { const: Present }
            href: { type: string, pattern: "^/api/v1/projects/prj_[0-9A-HJKMNP-TV-Z]{10,26}/human-reports/report_[0-9A-HJKMNP-TV-Z]{10,26}/content$" }
            disposition: { const: attachment }
    HumanReportSubmittedResult:
