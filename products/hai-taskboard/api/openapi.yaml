    ProjectionResetRequired:
      type: object
      additionalProperties: false
      required: [api_version, reason, current_epoch, minimum_sequence, snapshot_url]
      properties:
        api_version: { const: v1 }
        reason: { type: string, enum: [epoch_mismatch, retention_expired, slow_consumer, authorization_revoked] }
        current_epoch: { type: integer, minimum: 1 }
        minimum_sequence: { type: integer, minimum: 0 }
        snapshot_url: { type: string, pattern: "^/api/v1/projects/[^/]+/(board|attention)$" }
    CompletionPreparation:
      type: object
      additionalProperties: false
      required:
        [expected_version, phase, completion_subject, completion_subject_digest, lease_epoch,
         restore_generation, approval_required, verification_rules]
      description: >-
        Subject scope equals the route and its digest is recomputed. In Review, subject version
        equals expected_version + 1; in QA they are equal. Required ACs and rules are sorted,
        unique and have the same exact AC set. No gate result, coverage or reservation is implied.
      properties:
        expected_version: { type: integer, minimum: 1, maximum: 9223372036854775806 }
        phase: { type: string, enum: [Review, QA] }
        completion_subject: { $ref: "#/components/schemas/CompletionSubject" }
        completion_subject_digest: { $ref: "#/components/schemas/SHA256" }
        lease_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        restore_generation: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        approval_required: { type: boolean }
        verification_rules:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: "#/components/schemas/CompletionVerificationRule" }
    VerifiedCoverage:
      type: object
      additionalProperties: false
      required:
        [schema_version, observation_only, observed_at, expected_version, phase, subject_mode,
         completion_subject, completion_subject_digest, lease_epoch, restore_generation, cursor,
         approval_required, verification_rules, coverage, completion_eligibility]
      description: >-
        Scope and subject digest are validated. Required ACs, rules and coverage have identical
        sorted unique exact AC sets (max256). Review subject version is actual+1; QA is actual. Review actual version must permit a SQLite-safe actual+1.
        Matching evidence IDs identify all matching records, not only passing ones. Total IDs
        across the response are at most1024. No truncation. Byte limits are enforced by Go;
        JSON Schema maxLength counts characters. QA satisfied iff no eligibility reasons;
        satisfied requires every AC covered. Review is unevaluated with only phase_not_qa.
      properties:
        schema_version: { type: integer, const: 1 }
        observation_only: { type: boolean, const: true }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        expected_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        phase: { type: string, enum: [Review, QA] }
        subject_mode: { type: string, enum: [prospective_qa, current_qa] }
        completion_subject: { $ref: "#/components/schemas/VerifiedCoverageSubject" }
        completion_subject_digest: { $ref: "#/components/schemas/SHA256" }
        lease_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        restore_generation: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        cursor:
          type: object
          additionalProperties: false
          required: [stream_epoch, event_sequence]
          properties:
            stream_epoch: { type: integer, minimum: 1, maximum: 9223372036854775807 }
            event_sequence: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        approval_required: { type: boolean }
        verification_rules:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/CompletionVerificationRule" }
        coverage:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/VerifiedACCoverage" }
        completion_eligibility:
          type: object
          additionalProperties: false
          required: [evaluated, satisfied, reasons]
          properties:
            evaluated: { type: boolean }
            satisfied: { type: boolean }
            reasons:
              type: array
              maxItems: 13
              uniqueItems: true
              items:
                type: string
                enum: [phase_not_qa, active_blocker, active_or_unknown_run, candidate_unavailable,
                       review_missing, review_rejected, evidence_missing, evidence_unavailable,
                       evidence_stale, evidence_nonpassing, verifier_not_independent,
                       approval_missing, approval_expired]
    VerifiedACCoverage:
      type: object
      additionalProperties: false
      required: [ac_id, ac_revision_digest, covered, matching_evidence_ids, reasons]
      description: >-
        Covered iff reasons is empty and at least one matching ID exists. Missing iff IDs empty
        and evidence_missing is the sole reason. Reasons use the fixed listed order. Every
        uncovered AC reason must occur in QA eligibility; all matching records may veto coverage.
      properties:
        ac_id: { type: string, minLength: 1, maxLength: 120, description: "Exact accepted AC ID, at most120 UTF-8 bytes." }
        ac_revision_digest: { $ref: "#/components/schemas/SHA256" }
        covered: { type: boolean }
        matching_evidence_ids:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 120, description: "At most120 UTF-8 bytes, no controls; sorted exact bytes." }
        reasons:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [evidence_missing, evidence_unavailable, evidence_stale, evidence_nonpassing, verifier_not_independent]
    CompletionVerificationRule:
      type: object
      additionalProperties: false
      required:
        [ac_id, verifier_class, independent, prohibited_verifier_actor,
         prohibited_verifier_run_role, environment_digest]
      properties:
        ac_id:
          type: string
          minLength: 1
          maxLength: 120
          description: At most 120 UTF-8 bytes; no controls, whitespace or slashes.
        verifier_class:
          type: string
          minLength: 1
          maxLength: 128
          description: At most 128 UTF-8 bytes, no control characters.
        independent: { type: boolean }
        prohibited_verifier_actor:
          type: string
          maxLength: 120
          description: Empty or at most 120 UTF-8 bytes; no controls, whitespace or slashes.
        prohibited_verifier_run_role:
          type: string
          maxLength: 128
          description: At most 128 UTF-8 bytes, no control characters; empty is valid.
        environment_digest: { $ref: "#/components/schemas/SHA256" }
    VerifiedCoverageSubject:
      type: object
      additionalProperties: false
      required:
        [project_id, work_item_id, work_item_version, candidate_id, candidate_digest, run_id,
         run_input_digest, required_ac_revisions, accepted_graph_revision_digest,
