name = "kith"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
account_id = "56f4d1cd4c537962d99f12ae57192e94"

[vars]
ff_mcp = "on"
ff_hosted_agent = "on"
ff_sidecar = "off"
ff_ambient = "on"
ff_providers = "on"
ff_drafts = "on"
FAKE_LLM_TEXT = "hello from grok"
FAKE_LLM_MODELS = "grok-4.5"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kith"
database_id = "f7eb46f9-61f6-4ce8-a463-d790676557fc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TRACES"
bucket_name = "kith-traces"

[[kv_namespaces]]
binding = "SESSIONS"
id = "344a51ec4d224a71a4f2cc5ae07ae2e6"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[durable_objects.bindings]]
name = "HOSTED"
class_name = "HostedGeneration"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Inbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HostedGeneration"]
