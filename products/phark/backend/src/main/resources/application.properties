spring.application.name=deck
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.db.path=${APP_DB_PATH:./data/deck.db}
app.media.path=${APP_MEDIA_PATH:./data/media}
app.abuse.ip-hmac-secret=${APP_ABUSE_IP_HMAC_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
app.abuse.rate-limit.enabled=${APP_ABUSE_RATE_LIMIT_ENABLED:true}
server.forward-headers-strategy=none
