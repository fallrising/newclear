name: deck

services:
  app:
    image: ${APP_IMAGE}
    container_name: deck-app
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      SERVER_PORT: "8080"
      APP_DB_PATH: "/data/deck.db"
      APP_MEDIA_PATH: "/data/media"
      APP_ABUSE_IP_HMAC_SECRET: "${APP_ABUSE_IP_HMAC_SECRET:?APP_ABUSE_IP_HMAC_SECRET is required: set a distinct random 32-byte unpadded base64url value; see deploy/templates/deck/.env.example}"
      SPRING_PROFILES_ACTIVE: "prod"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75
        -Dfile.encoding=UTF-8

    volumes:
      - "./data:/data"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.deck.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.deck.entrypoints=websecure"
      - "traefik.http.routers.deck.tls=true"
      - "traefik.http.routers.deck.tls.certresolver=le"

      - "traefik.http.services.deck.loadbalancer.server.port=8080"
      - "traefik.http.services.deck.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.deck.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.deck.loadbalancer.healthcheck.timeout=3s"

    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    read_only: true

    tmpfs:
      - "/tmp:size=64m,mode=1777"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
