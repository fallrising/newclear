name: images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha=${GITHUB_SHA::12}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fleetd
          push: true
          tags: |
            ghcr.io/fallrising/fleetd:${{ steps.meta.outputs.sha }}
            ghcr.io/fallrising/fleetd:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          tags: |
            ghcr.io/fallrising/fleet-agent:${{ steps.meta.outputs.sha }}
            ghcr.io/fallrising/fleet-agent:${{ steps.meta.outputs.tag }}
