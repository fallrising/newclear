apiVersion: fleet.catalog/v1
kind: Service
metadata:
  name: files
  description: File relay origin. Large blobs must not use public Tunnel hostnames.
  labels:
    fleet.catalog/large-origin: "true"
spec:
  node: vps-hel-1
  image: ghcr.io/fallrising/file-relay:REPLACE_SHA
  expose:
    mode: private
    hostname: files.fleet.internal
    port: 8080
    healthPath: /healthz
  command: ["/file-relay"]
  args: ["--listen", ":8080"]
  workingDir: /data
  user: "65532:65532"
  resources:
    memory: 256M
    cpus: "0.50"
  volumes:
    - name: blobs
      mount: /data
  secrets:
    - RELAY_TOKEN
