apiVersion: v1
kind: ConfigMap
metadata:
  name: ojbquay-runtime
data:
  kafka-bootstrap-servers: kafka.example.internal:9093
  database-url: jdbc:postgresql://postgres.example.internal:5432/ojbquay
  database-user: ojbquay
  java-tool-options: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ojbquay-secrets
type: Opaque
stringData:
  database-password: REPLACE_ME
  bootstrap-admin-password: REPLACE_ME
