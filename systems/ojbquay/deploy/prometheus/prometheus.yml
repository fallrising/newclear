global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: console-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["console-api:8080"]
  - job_name: lag-exporter
    metrics_path: /internal/v1/lag-exporter
    static_configs:
      - targets: ["console-api:8080"]
  - job_name: gateway-produce
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-produce:9200"]
  - job_name: gateway-consume
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-consume:9202"]
  - job_name: scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9201"]
